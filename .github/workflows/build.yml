name: Windows native plugin
on:
  push:
    branches: [main, codex/native-table]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-tools-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PiPL resource encoder
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Configure host-independent core
        run: cmake -S . -B build/core -A x64 -T v142 -DTABLE_BUILD_PLUGIN=OFF
      - name: Compile core tests
        run: cmake --build build/core --config Release --parallel 2
      - name: Test model-owned editing and Windows glyph outlines
        run: ctest --test-dir build/core -C Release --output-on-failure
      - name: Simulate repeated sidebar workflows
        shell: pwsh
        run: |
          $env:TABLE_SIMULATOR = (Resolve-Path 'build/core/Release/table_simulator.exe').Path
          python -m unittest discover -s tests -p 'test_simulation.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Sidebar simulation tests failed.' }
  native:
    needs: build-tools-tests
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/native-table')
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write # GitHub requires push access to read an unpublished draft release.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch unpublished verified SDK build input
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_sdk.py
      - name: Compile Illustrator 2024 x64 plugin with v142
        shell: pwsh
        run: ./scripts/build.ps1 -SdkRoot './.local/sdk/Adobe Illustrator 2024 SDK'
      - name: Verify native binary and package development build
        shell: pwsh
        run: |
          $env:TABLE_TEST_PLUGIN = (Resolve-Path 'build/native/plugin/Release/IllustratorTableTool.aip').Path
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native packaging tests failed.' }
          ./scripts/package.ps1 -PluginPath $env:TABLE_TEST_PLUGIN -OutputDirectory './dist/package'
      - name: Upload development plugin package
        uses: actions/upload-artifact@v4
        with:
          name: IllustratorTableTool-0.2.3-win64-local-test
          path: dist/package/*
          if-no-files-found: error
          retention-days: 14
