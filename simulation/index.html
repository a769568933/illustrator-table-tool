<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画布表格 · 侧边栏模拟测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#24262b;color:#e8e9ed;font:14px 'Microsoft YaHei UI',sans-serif}header{height:74px;border-bottom:1px solid #45474c;display:flex;align-items:center;justify-content:space-between;padding:0 28px}h1{font-size:19px;margin:0}header p{font-size:12px;color:#aeb2ba;margin:7px 0 0}.tag{color:#ffc881;background:#513b24;padding:7px 12px;border-radius:6px}main{display:grid;grid-template-columns:minmax(450px,1fr) 300px;min-height:calc(100vh - 74px)}.work{padding:28px;background:#34373e}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:26px}.toolbar span{margin-right:auto;color:#b8bdc8}button{background:#42464f;color:#f3f4f7;border:1px solid #606671;border-radius:5px;min-height:35px;padding:7px 12px;cursor:pointer}button:hover{background:#535b6a}button:disabled{opacity:.35;cursor:default}.primary{background:#cc751e;border-color:#e58a32;color:#fff}.paper{background:#fff;min-height:420px;padding:45px 30px;overflow:auto;box-shadow:0 8px 28px #0004}.canvas{position:relative;margin:auto}.cell{position:absolute;border:1px solid #6f737b;color:#222;padding:5px;overflow:hidden;white-space:pre-wrap;cursor:pointer;user-select:none}.cell.selected{outline:2px solid #2583e8;outline-offset:-2px;z-index:2;background-image:linear-gradient(#2583e812,#2583e812)}aside{padding:22px 20px;background:#292c32;border-left:1px solid #464b55}h2{font-size:16px;margin:0 0 6px}h3{font-size:12px;font-weight:400;color:#aab1bd;margin:23px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:12px;color:#abb3bf;line-height:1.7}.selection{margin-top:17px;background:#343943;border:1px solid #4d5562;border-radius:6px;padding:12px;color:#bdcbe0}.status{font-size:12px;color:#b9c3d0;line-height:1.8;margin-top:23px;border-top:1px solid #484d56;padding-top:15px}.error{color:#ffb5a7}#checks{margin-top:18px;white-space:pre-wrap;color:#9ed6ad;font:12px/1.8 'Microsoft YaHei UI',sans-serif}input{width:70px;background:#282c33;border:1px solid #646c7b;color:white;padding:6px;border-radius:4px}label{font-size:12px}.foot{color:#a5acb9;font-size:12px;margin-top:20px;line-height:1.8}@media(max-width:850px){main{grid-template-columns:1fr}.work{padding:15px}aside{border-top:1px solid #555}.paper{min-height:280px;padding:25px 10px}}
</style>
<header><div><h1>画布表格</h1><p>侧边栏操作与结构测试</p></div><span class="tag">模拟环境 · 不修改 AI 文档</span></header>
<main><section class="work"><div class="toolbar"><span id="dimensions">正在载入…</span><button id="undo">撤销</button><button id="redo">重做</button><button id="test">运行模拟测试</button></div><div class="paper"><div class="canvas" id="canvas"></div></div><div id="checks"></div><p class="foot">单击选格，按住 Shift 再单击选择矩形区域。所有结构操作均由插件实际使用的 C++ 核心执行。模拟撤销使用完整数据快照；Illustrator 的撤销和输入法仍须实机验证。</p></section>
<aside><h2>画布表格</h2><p class="hint">在画布选择单元格，再使用下方操作。</p><div class="grid"><label>行数 <input id="rows" type="number" value="4" min="1" max="100"></label><label>列数 <input id="columns" type="number" value="4" min="1" max="50"></label></div><div class="grid" style="margin-top:12px"><button id="create" class="primary">新建表格</button><button id="sample">填入示例文字</button></div><div class="selection" id="selection">未选择单元格</div><h3>合并与拆分</h3><div class="grid"><button data-command="0">合并单元格</button><button data-command="1">拆分单元格</button></div><h3>行操作</h3><div class="grid"><button data-command="2">上方插入行</button><button data-command="3">下方插入行</button><button data-command="6">删除所选行</button></div><h3>列操作</h3><div class="grid"><button data-command="4">左侧插入列</button><button data-command="5">右侧插入列</button><button data-command="7">删除所选列</button></div><h3>外观</h3><button id="style" style="width:100%">应用示例样式</button><div id="status" class="status">正在连接表格核心…</div></aside></main>
<script>
let model=null,selection=null,anchor=null,busy=false,undo=[],redo=[];
const $=id=>document.getElementById(id);
async function call(action,extra={},state=model?.state){const response=await fetch('/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,state,...extra})});const result=await response.json();if(!response.ok)throw Error(result.error);return result}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function render(){if(!model)return;const scale=Math.min(1.65,Math.max(.3,($('canvas').parentElement.clientWidth-65)/model.width));const canvas=$('canvas');canvas.replaceChildren();canvas.style.width=model.width*scale+'px';canvas.style.height=model.height*scale+'px';for(const cell of model.cells){const e=document.createElement('div');e.className='cell';e.style.cssText=`left:${cell.x*scale}px;top:${cell.y*scale}px;width:${cell.width*scale+1}px;height:${cell.height*scale+1}px;background-color:rgb(${cell.fill.map(n=>Math.round(n*255)).join(',')});font-size:${cell.size*scale}px`;e.textContent=cell.text;if(selection&&cell.row<=selection[2]&&cell.row+cell.rowSpan>selection[0]&&cell.column<=selection[3]&&cell.column+cell.columnSpan>selection[1])e.classList.add('selected');e.onclick=async event=>{if(busy)return;try{if(!event.shiftKey||!anchor)anchor=[cell.row,cell.column];const result=await call('select',{selection:[...anchor,cell.row,cell.column]});selection=result.selection;render()}catch(error){status(error.message,true)}};canvas.append(e)}$('dimensions').textContent=`${model.rows} 行 × ${model.columns} 列 · ${model.cells.length} 个单元格`;$('selection').textContent=selection?`选区：第 ${selection[0]+1}–${selection[2]+1} 行，第 ${selection[1]+1}–${selection[3]+1} 列`:'未选择单元格';document.querySelectorAll('[data-command],#style').forEach(e=>e.disabled=!selection||busy);$('undo').disabled=!undo.length||busy;$('redo').disabled=!redo.length||busy}
async function change(action,extra={}){if(busy)return;busy=true;render();try{const before=model?.state;const next=await call(action,extra);if(before&&before!==next.state){undo.push(before);redo=[]}model=next;selection=null;anchor=null;status('操作完成。结构及文字已由 C++ 核心校验。')}catch(error){status('操作未执行：'+error.message,true)}finally{busy=false;render()}}
document.querySelectorAll('[data-command]').forEach(e=>e.onclick=()=>change('command',{selection,command:Number(e.dataset.command)}));$('create').onclick=()=>change('create',{rows:Number($('rows').value),columns:Number($('columns').value)});$('sample').onclick=()=>change('sample');$('style').onclick=()=>change('style',{selection});
for(const [id,from,to] of [['undo',undo,redo],['redo',redo,undo]])$(id).onclick=async()=>{const source=id==='undo'?undo:redo,target=id==='undo'?redo:undo;if(!source.length)return;const state=source[source.length-1];try{const next=await call('inspect',{},state);source.pop();target.push(model.state);model=next;selection=null;anchor=null;render();status(id==='undo'?'已撤销模拟操作。':'已重做模拟操作。')}catch(error){status(error.message,true)}};
$('test').onclick=async()=>{if(busy)return;busy=true;render();const results=[];const check=(value,label)=>{if(!value)throw Error(label);results.push('✓ '+label)};try{let t=await call('create',{rows:3,columns:3},'');t=await call('sample',{},t.state);const original=t.state;t=await call('command',{selection:[0,0,1,1],command:0},t.state);check(t.cells.some(c=>c.rowSpan===2&&c.columnSpan===2&&c.text.includes('中文文字 ABC')),'2×2 合并保留中文和数字');t=await call('command',{selection:[0,0,0,0],command:3},t.state);check(t.rows===4&&t.cells.some(c=>c.rowSpan===3),'跨合并区插行保持跨度');t=await call('command',{selection:[0,0,2,1],command:1},t.state);check(t.cells.some(c=>c.row===0&&c.column===1&&c.text==='数量'),'拆分还原原单元格内容');const saved=await call('inspect',{},t.state);check(saved.state===t.state,'保存数据往返一致');const restored=await call('inspect',{},original);check(restored.rows===3&&restored.cells.length===9,'撤销快照完整恢复');let rejected=false;try{await call('command',{selection:[0,0,2,2],command:6},original)}catch{rejected=true}check(rejected,'禁止删除整张表');$('checks').textContent=results.join('\n');status('6 项模拟流程测试通过；此结果不代表宿主实机验收已完成。')}catch(error){$('checks').textContent=results.join('\n');status('模拟测试失败：'+error.message,true)}finally{busy=false;render()}};
change('create',{rows:4,columns:4});window.addEventListener('resize',render);
</script></html>
