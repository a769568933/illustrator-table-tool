<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画布表格 · 无文字框编辑模拟</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#24262b;color:#e8e9ed;font:14px 'Microsoft YaHei UI',sans-serif}header{min-height:80px;border-bottom:1px solid #45474c;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;gap:20px}h1{font-size:19px;margin:0}header p{font-size:12px;color:#aeb2ba;margin:7px 0 0}.tag{color:#ffc881;background:#513b24;padding:7px 12px;border-radius:6px}main{display:grid;grid-template-columns:minmax(450px,1fr) 300px;min-height:calc(100vh - 80px)}.work{padding:28px;background:#34373e}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:26px}.toolbar span{margin-right:auto;color:#b8bdc8}button{background:#42464f;color:#f3f4f7;border:1px solid #606671;border-radius:5px;min-height:35px;padding:7px 12px;cursor:pointer}button:hover{background:#535b6a}button:disabled{opacity:.35;cursor:default}.primary{background:#cc751e;border-color:#e58a32;color:#fff}.paper{background:#fff;min-height:420px;padding:45px 30px;overflow:auto;box-shadow:0 8px 28px #0004}.canvas{position:relative;margin:auto}.cell{position:absolute;border:1px solid #6f737b;color:#222;padding:5px;overflow:hidden;white-space:pre-wrap;cursor:pointer;user-select:none}.cell.selected{outline:2px solid #2583e8;outline-offset:-2px;z-index:2;background-image:linear-gradient(#2583e812,#2583e812)}#editor{position:absolute;z-index:4;outline:1px solid #2583e8;cursor:text;touch-action:none}aside{padding:22px 20px;background:#292c32;border-left:1px solid #464b55}h2{font-size:16px;margin:0 0 6px}h3{font-size:12px;font-weight:400;color:#aab1bd;margin:23px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint,.foot{font-size:12px;color:#abb3bf;line-height:1.8}.selection{margin-top:17px;background:#343943;border:1px solid #4d5562;border-radius:6px;padding:12px;color:#bdcbe0}.status{font-size:12px;color:#b9c3d0;line-height:1.8;margin-top:23px;border-top:1px solid #484d56;padding-top:15px}.error{color:#ffb5a7}#checks{margin-top:18px;white-space:pre-wrap;color:#9ed6ad;font-size:12px;line-height:1.8}input{width:70px;background:#282c33;border:1px solid #646c7b;color:white;padding:6px;border-radius:4px}label{font-size:12px}.foot{margin-top:20px}@media(max-width:850px){main{grid-template-columns:1fr}.work{padding:15px}aside{border-top:1px solid #555}.paper{padding:25px 10px}}
</style>
<header><div><h1>画布表格</h1><p>格内编辑 · 合并拆分 · 行列操作</p></div><span class="tag">C++ 核心模拟 · 不修改 AI 文档</span></header>
<main><section class="work"><div class="toolbar"><span id="dimensions">正在载入…</span><button id="undo">撤销</button><button id="redo">重做</button><button id="test">运行模拟测试</button></div><div class="paper"><div class="canvas" id="canvas"><div id="cells" role="grid" aria-label="模拟表格"></div><canvas id="editor" tabindex="0" aria-label="单元格文字编辑" hidden></canvas></div></div><div id="checks"></div><p class="foot">单击选格；按住鼠标拖选区域；Shift 多选；双击格内输入，拖动选字。Tab / Shift+Tab 切格，Enter 换行，Esc 退出编辑。合并等操作位于右侧。浏览器排版仅用于演示，AI 插件使用独立的 Windows 排版和矢量路径。</p></section>
<aside><h2>画布表格</h2><p class="hint" id="inputSupport">正文在画布中编辑，侧栏只放表格操作。</p><div class="grid"><label>行数 <input id="rows" type="number" value="4" min="1" max="100"></label><label>列数 <input id="columns" type="number" value="4" min="1" max="50"></label></div><div class="grid" style="margin-top:12px"><button id="create" class="primary">新建表格</button><button id="sample">填入示例文字</button></div><div class="selection" id="selection">未选择单元格</div><h3>合并与拆分</h3><div class="grid"><button data-command="0">合并单元格</button><button data-command="1">拆分单元格</button></div><h3>行操作</h3><div class="grid"><button data-command="2">上方插入行</button><button data-command="3">下方插入行</button><button data-command="6">删除所选行</button></div><h3>列操作</h3><div class="grid"><button data-command="4">左侧插入列</button><button data-command="5">右侧插入列</button><button data-command="7">删除所选列</button></div><h3>平均分布</h3><div class="grid"><button data-command="8">平均行高</button><button data-command="9">平均列宽</button></div><h3>文字与单元格</h3><label>字体 <select id="font"><option value="">默认字体</option><option>宋体</option><option>Microsoft YaHei</option><option>Arial</option></select></label><button id="applyFont">应用字体</button><div class="grid"><label>字号 <input id="fontSize" type="number" value="18" min="1" max="1000"></label><button id="applySize">应用字号</button></div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><button data-horizontal="0">左对齐</button><button data-horizontal="1">水平居中</button><button data-horizontal="2">右对齐</button><button data-vertical="0">顶部对齐</button><button data-vertical="1">垂直居中</button><button data-vertical="2">底部对齐</button></div><p><label><input id="transparent" type="checkbox" checked style="width:auto">透明背景（无填充）</label></p><h3>外观</h3><button id="style" style="width:100%">应用示例样式</button><div id="status" class="status">正在连接表格核心…</div></aside></main>
<script>
const $=id=>document.getElementById(id),editor=$('editor'),ctx=editor.getContext('2d'),segmenter=new Intl.Segmenter('zh',{granularity:'grapheme'});
let cellDrag=null,suppressClick=false;
let model=null,selection=null,anchor=null,active=null,scale=1,busy=false,pending=0,queue=Promise.resolve(),undo=[],redo=[],points=[],dragging=false,composing=false,draft=null,ec=null;
async function call(action,extra={},state=model?.state){const response=await fetch('/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,state,...extra})});const result=await response.json();if(!response.ok)throw Error(result.error);return result}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function current(){return active&&model?.cells.find(c=>c.row===active.row&&c.column===active.column)}
function boundaries(text){return [...new Set([0,...Array.from(segmenter.segment(text),s=>s.index+s.segment.length)])]}
function syncContext(){if(!ec||!active||composing||pending)return;const cell=current();if(!cell)return;ec.updateText(0,ec.text.length,cell.text);ec.updateSelection(active.anchor,active.caret);const box=editor.getBoundingClientRect();ec.updateControlBounds(box);const caret=points.find(p=>p.index===active.caret)||points[0];if(caret)ec.updateSelectionBounds(new DOMRect(box.x+caret.x,box.y+caret.y,1,caret.height))}
function paintEditor(){
  const cell=current();if(!cell){editor.hidden=true;return}editor.hidden=false;const width=cell.width*scale,height=cell.height*scale,dpr=devicePixelRatio||1;
  editor.style.cssText=`left:${cell.x*scale}px;top:${cell.y*scale}px;width:${width}px;height:${height}px`;editor.width=Math.max(1,Math.ceil(width*dpr));editor.height=Math.max(1,Math.ceil(height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);if(cell.fillEnabled){ctx.fillStyle=`rgb(${cell.fill.map(n=>Math.round(n*255)).join(',')})`;ctx.fillRect(0,0,width,height);}
  const text=draft??cell.text,pad=5,defaultHeight=cell.size*scale*1.4,lines=[{items:[],width:0,height:defaultHeight,start:0}];let line=lines[0];
  for(const part of segmenter.segment(text)){
    const run=cell.runs?.find(r=>part.index>=r.start&&part.index<r.start+r.length),size=(run?.size??cell.size)*scale,family=run?.font||cell.font||'Microsoft YaHei UI',font=`${size}px ${JSON.stringify(family)},sans-serif`;ctx.font=font;
    const advance=part.segment==='\n'?0:ctx.measureText(part.segment).width;
    if(line.width+advance>width-2*pad&&line.items.length){line={items:[],width:0,height:defaultHeight,start:part.index};lines.push(line);}
    line.items.push({part,run,size,font,advance});line.width+=advance;line.height=Math.max(line.height,size*1.4);
    if(part.segment==='\n'){line={items:[],width:0,height:defaultHeight,start:part.index+1};lines.push(line);}
  }
  let y=pad+Math.max(0,height-2*pad-lines.reduce((sum,l)=>sum+l.height,0))*([0,.5,1][cell.verticalAlignment]||0);const stops=new Map(),first=Math.min(active.anchor,active.caret),last=Math.max(active.anchor,active.caret);
  for(const l of lines){let x=pad+Math.max(0,width-2*pad-l.width)*([0,.5,1][cell.alignment]||0);stops.set(l.start,{index:l.start,x,y,height:l.height});
    for(const glyph of l.items){const {part,run,size,font,advance}=glyph;ctx.font=font;stops.set(part.index,{index:part.index,x,y,height:l.height});
      if(part.index>=first&&part.index<last&&!composing){ctx.fillStyle='#b4d7ff';ctx.fillRect(x,y,Math.max(advance,3),l.height);}ctx.fillStyle=run?.color?`rgb(${run.color.map(c=>Math.round(c*255)).join(',')})`:'#222';if(part.segment!=='\n')ctx.fillText(part.segment,x,y+size);x+=advance;stops.set(part.index+part.segment.length,{index:part.index+part.segment.length,x,y,height:l.height});
    }y+=l.height;
  }
  points=Array.from(stops.values()).sort((a,b)=>a.index-b.index);const caret=stops.get(active.caret)||points[points.length-1];if(caret){ctx.fillStyle='#1678e8';ctx.fillRect(caret.x,caret.y,1,caret.height);}
}
function render(){if(!model)return;scale=Math.min(1.65,Math.max(.3,($('canvas').parentElement.clientWidth-65)/model.width));$('canvas').style.width=model.width*scale+'px';$('canvas').style.height=model.height*scale+'px';const existing=new Map(Array.from($('cells').children,e=>[Number(e.dataset.id),e]));
  for(const cell of model.cells){const e=existing.get(cell.id)||document.createElement('div');existing.delete(cell.id);e.dataset.id=cell.id;e.className='cell';e.setAttribute('role','gridcell');e.setAttribute('aria-label',`第${cell.row+1}行第${cell.column+1}列`);e.style.cssText=`left:${cell.x*scale}px;top:${cell.y*scale}px;width:${cell.width*scale+1}px;height:${cell.height*scale+1}px;background-color:${cell.fillEnabled?`rgb(${cell.fill.map(n=>Math.round(n*255)).join(',')})`:'transparent'};font-size:${cell.size*scale}px;display:flex;flex-direction:column;justify-content:${['flex-start','center','flex-end'][cell.verticalAlignment]};text-align:${['left','center','right'][cell.alignment]}`;e.style.fontFamily=cell.font?JSON.stringify(cell.font)+",sans-serif":"Microsoft YaHei UI,sans-serif";e.style.color=active&&cell.row===active.row&&cell.column===active.column?'transparent':'#222';e.textContent=cell.text;
    if(selection&&cell.row<=selection[2]&&cell.row+cell.rowSpan>selection[0]&&cell.column<=selection[3]&&cell.column+cell.columnSpan>selection[1])e.classList.add('selected');
    e.onpointerdown=event=>{if(event.button!==0||pending||busy||composing)return;cellDrag={row:cell.row,column:cell.column,x:event.clientX,y:event.clientY,moved:false,last:cell}};
    e.onclick=event=>{if(suppressClick){suppressClick=false;return}if(event.detail>1||pending||busy||composing)return;active=null;editor.editContext=null;if(!event.shiftKey||!anchor)anchor=[cell.row,cell.column];enqueue(async()=>{selection=(await call('select',{selection:[...anchor,cell.row,cell.column]})).selection;render()})};
    e.ondblclick=event=>{event.preventDefault();if(busy||composing)return;enqueue(async()=>{active={row:cell.row,column:cell.column,anchor:0,caret:0};selection=[cell.row,cell.column,cell.row+cell.rowSpan-1,cell.column+cell.columnSpan-1];draft=null;render();if(ec)editor.editContext=ec;editor.focus()})};if(!e.parentElement)$('cells').append(e);}for(const e of existing.values())e.remove();
  $('dimensions').textContent=`${model.rows} 行 × ${model.columns} 列 · ${model.cells.length} 个单元格`;$('selection').textContent=active?`文字编辑：第 ${active.row+1} 行，第 ${active.column+1} 列`:selection?`选区：第 ${selection[0]+1}–${selection[2]+1} 行，第 ${selection[1]+1}–${selection[3]+1} 列`:'未选择单元格';document.querySelectorAll('[data-command],#style,#applyFont,#applySize,[data-horizontal],[data-vertical],#transparent').forEach(e=>e.disabled=!selection||busy||pending>0);$('undo').disabled=!undo.length||pending>0;$('redo').disabled=!redo.length||pending>0;paintEditor();syncContext();}
$('cells').onpointermove=event=>{
  if(!cellDrag)return;if(Math.hypot(event.clientX-cellDrag.x,event.clientY-cellDrag.y)>3)cellDrag.moved=true;if(!cellDrag.moved)return;if(!$('cells').hasPointerCapture(event.pointerId))$('cells').setPointerCapture(event.pointerId);
  const box=$('canvas').getBoundingClientRect(),x=Math.max(0,Math.min(model.width-.001,(event.clientX-box.left)/scale)),y=Math.max(0,Math.min(model.height-.001,(event.clientY-box.top)/scale));
  const cell=model.cells.find(c=>x>=c.x&&x<c.x+c.width&&y>=c.y&&y<c.y+c.height);if(!cell)return;cellDrag.last=cell;
  selection=[Math.min(cellDrag.row,cell.row),Math.min(cellDrag.column,cell.column),Math.max(cellDrag.row,cell.row+cell.rowSpan-1),Math.max(cellDrag.column,cell.column+cell.columnSpan-1)];
  let changed;do{changed=false;for(const c of model.cells){if(c.row>selection[2]||c.column>selection[3]||c.row+c.rowSpan<=selection[0]||c.column+c.columnSpan<=selection[1])continue;const next=[Math.min(selection[0],c.row),Math.min(selection[1],c.column),Math.max(selection[2],c.row+c.rowSpan-1),Math.max(selection[3],c.column+c.columnSpan-1)];if(next.some((v,i)=>v!==selection[i])){selection=next;changed=true}}}while(changed);render();
};
$('cells').onpointerup=event=>{const drag=cellDrag;cellDrag=null;if($('cells').hasPointerCapture(event.pointerId))$('cells').releasePointerCapture(event.pointerId);if(!drag?.moved)return;suppressClick=true;anchor=[drag.row,drag.column];enqueue(async()=>{selection=(await call('dragSelect',{selection:[drag.row,drag.column,drag.last.row,drag.last.column]})).selection})};
$('cells').addEventListener('click',event=>{if(suppressClick){suppressClick=false;event.stopImmediatePropagation();event.preventDefault()}},true);
$('cells').onpointercancel=()=>{cellDrag=null};
function enqueue(task){pending++;queue=queue.then(task).catch(error=>{status('操作未完成：'+error.message,true);composing=false;draft=null}).finally(()=>{pending--;render()});return queue}
async function replace(action,extra={}){if(!active)return;const before=model.state;const next=await call(action,{row:active.row,column:active.column,anchor:active.anchor,caret:active.caret,...extra});if(before!==next.state){undo.push(before);redo=[]}model=next;const cell=model.cells.find(c=>c.id===model.editor.cellId);active={row:cell.row,column:cell.column,anchor:model.editor.anchor,caret:model.editor.caret};selection=model.selection;draft=null;status('文字与表格数据已由 C++ 核心校验。')}
async function change(action,extra={}){if(composing){status('请先确认或取消当前组字，再操作表格。',true);return}return enqueue(async()=>{busy=true;try{const before=model?.state;const next=await call(action,extra);if(before&&before!==next.state){undo.push(before);redo=[]}model=next;active=null;selection=action==='format'||(action==='command'&&extra.command>=8)?next.selection:null;anchor=null;editor.editContext=null;status('操作完成。')}finally{busy=false}})}
function hit(event){const box=editor.getBoundingClientRect(),x=event.clientX-box.left,y=event.clientY-box.top;let closest=points[0],distance=Infinity;for(const p of points){const d=Math.abs(y-(p.y+p.height/2))*100+Math.abs(x-p.x);if(d<distance){distance=d;closest=p}}return closest?.index??0}
editor.onpointerdown=event=>{if(pending||composing)return;const index=hit(event);active.anchor=active.caret=index;dragging=true;editor.setPointerCapture(event.pointerId);render();editor.focus()};editor.onpointermove=event=>{if(dragging){active.caret=hit(event);paintEditor();syncContext()}};editor.onpointerup=event=>{dragging=false;if(editor.hasPointerCapture(event.pointerId))editor.releasePointerCapture(event.pointerId)};
if('EditContext' in window){ec=new EditContext();ec.addEventListener('compositionstart',()=>{composing=true;draft=ec.text});ec.addEventListener('textupdate',event=>{if(!active)return;if(composing){draft=ec.text;active.anchor=ec.selectionStart;active.caret=ec.selectionEnd;paintEditor()}else enqueue(()=>replace('edit',{anchor:event.updateRangeStart,caret:event.updateRangeEnd,text:event.text}))});ec.addEventListener('compositionend',()=>{if(!active)return;const result=ec.text,caret=ec.selectionEnd;composing=false;draft=null;enqueue(async()=>{await replace('edit',{anchor:0,caret:current().text.length,text:result});active.anchor=active.caret=Math.min(caret,current().text.length)})});}else $('inputSupport').textContent='当前浏览器使用简化键盘模拟。中文可粘贴或填入示例；AI 插件的输入法需在本地测试。';
editor.onkeydown=event=>{if(!active||composing||event.isComposing)return;const control=event.ctrlKey||event.metaKey,key=event.key;
  if(control&&['z','y'].includes(key.toLowerCase())){event.preventDefault();$(key.toLowerCase()==='y'||event.shiftKey?'redo':'undo').click();return}
  if(control&&key.toLowerCase()==='a'){event.preventDefault();active.anchor=0;active.caret=current().text.length;render();return}
  if(control&&['c','x'].includes(key.toLowerCase())){event.preventDefault();const a=Math.min(active.anchor,active.caret),b=Math.max(active.anchor,active.caret);navigator.clipboard.writeText(current().text.slice(a,b)).then(()=>{if(key.toLowerCase()==='x')enqueue(()=>replace('edit',{text:''}))}).catch(e=>status(e.message,true));return}
  if(key==='Escape'){event.preventDefault();active=null;editor.editContext=null;render();return}
  if(key==='Tab'){event.preventDefault();enqueue(()=>replace('tab',{backward:event.shiftKey}));return}
  if(key==='Enter'){event.preventDefault();enqueue(()=>replace('edit',{text:'\n'}));return}
  if(key==='Backspace'||key==='Delete'){event.preventDefault();enqueue(()=>replace('deleteCluster',{backward:key==='Backspace',boundaries:boundaries(current().text)}));return}
  if(['ArrowLeft','ArrowRight','Home','End'].includes(key)){event.preventDefault();const stops=boundaries(current().text);let index=stops.indexOf(active.caret);if(key==='Home')index=0;else if(key==='End')index=stops.length-1;else index=Math.max(0,Math.min(stops.length-1,index+(key==='ArrowLeft'?-1:1)));active.caret=stops[index];if(!event.shiftKey)active.anchor=active.caret;render();return}
  if(!ec&&!control&&Array.from(key).length===1){event.preventDefault();enqueue(()=>replace('edit',{text:key}))}};
editor.onpaste=event=>{if(!active||composing)return;event.preventDefault();const text=event.clipboardData.getData('text/plain');enqueue(()=>replace('edit',{text}))};
document.querySelectorAll('[data-command]').forEach(e=>e.onclick=()=>change('command',{selection,command:Number(e.dataset.command)}));$('create').onclick=()=>change('create',{rows:Number($('rows').value),columns:Number($('columns').value)});$('sample').onclick=()=>change('sample');$('style').onclick=()=>change('style',{selection});$('applyFont').onclick=()=>change('format',{selection,font:$('font').value});$('applySize').onclick=()=>change('format',{selection,fontSize:Number($('fontSize').value)});document.querySelectorAll('[data-horizontal]').forEach(e=>e.onclick=()=>change('format',{selection,alignment:Number(e.dataset.horizontal)}));document.querySelectorAll('[data-vertical]').forEach(e=>e.onclick=()=>change('format',{selection,verticalAlignment:Number(e.dataset.vertical)}));$('transparent').onchange=()=>change('format',{selection,fillEnabled:!$('transparent').checked});
for(const id of ['undo','redo'])$(id).onclick=()=>{if(composing)return;enqueue(async()=>{const source=id==='undo'?undo:redo,target=id==='undo'?redo:undo;if(!source.length)return;const next=await call('inspect',{},source[source.length-1]);source.pop();target.push(model.state);model=next;active=null;selection=null;anchor=null;editor.editContext=null;status('已'+(id==='undo'?'撤销':'重做')+'模拟操作。')})};
$('test').onclick=()=>enqueue(async()=>{const results=[],check=(value,label)=>{if(!value)throw Error(label);results.push('✓ '+label)};let t=await call('create',{rows:3,columns:3},'');t=await call('sample',{},t.state);const original=t.state;t=await call('command',{selection:[0,0,1,1],command:0},t.state);check(t.cells.some(c=>c.rowSpan===2&&c.columnSpan===2&&c.text.includes('中文文字 ABC')),'2×2 合并保留中文和数字');t=await call('command',{selection:[0,0,0,0],command:3},t.state);check(t.rows===4&&t.cells.some(c=>c.rowSpan===3),'跨合并区插行保持跨度');t=await call('command',{selection:[0,0,2,1],command:1},t.state);check(t.cells.some(c=>c.row===0&&c.column===1&&c.text==='数量'),'拆分还原原格内容');check((await call('inspect',{},t.state)).state===t.state,'保存数据往返一致');check((await call('inspect',{},original)).cells.length===9,'撤销快照完整恢复');let rejected=false;try{await call('command',{selection:[0,0,2,2],command:6},original)}catch{rejected=true}check(rejected,'禁止删除整张表');t=await call('edit',{row:0,column:0,anchor:0,caret:0,text:'表格\n123'},t.state);check(t.cells.find(c=>c.row===0&&c.column===0).text.startsWith('表格\n123'),'格内中文替换与换行');t=await call('tab',{row:0,column:0,anchor:0,caret:0},t.state);check(t.editor.cellId===t.cells.find(c=>c.row===0&&c.column===1).id,'Tab 切换下一可见格');$('checks').textContent=results.join('\n');status('8 项模拟流程通过；不代表 Illustrator 实机验收通过。')});
change('create',{rows:4,columns:4});window.addEventListener('resize',render);
</script></html>
